# Curadoria de conflitos do TEATRO//OPS (aprovada em 14/11/2026).
#
# Critério de inclusão: conflito com eventos no UCDP Candidate GED no último trimestre com dados
# e ao menos 25 mortes estimadas no trimestre. Ficam fora países em que a violência registrada é
# quase toda entre grupos criminosos (< 25 mortes no trimestre em conflitos com o Estado).
#
# A INTENSIDADE NÃO É DEFINIDA AQUI: é recalculada a cada coleta do UCDP (job "eventos") sobre os
# últimos 3 meses com dados — alta: >= 250 mortes estimadas (ritmo de 1.000/ano, limiar de "guerra"
# do UCDP); tensão: 25–249 (piso de "conflito armado" do UCDP). "Cessar-fogo" só com fonte editorial.
#
# ucdp: regras para ligar eventos ao conflito — país como o UCDP escreve e, opcionalmente, os
# `conflict_new_id` aceitos naquele país (sem `conflitos` = todos os eventos do país).

conflitos:
