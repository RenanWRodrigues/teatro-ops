# Registro de fontes do TEATRO//OPS
# status: ativa | a_verificar | quebrada | desativada
# Toda fonte começa "a_verificar". Só mude para "ativa" depois de uma requisição real bem-sucedida.
# Para sites de governo, "pagina" é o ponto de partida: descubra o feed RSS real e preencha "feed".

conflitos:
  - id: gdelt-doc
    nome: GDELT DOC 2.0 API
    url: https://api.gdeltproject.org/api/v2/doc/doc
    tipo: api
    auth: nenhuma
    limite: "1 req / 5 s"
    licenca: "Livre para qualquer uso, com citação e link ao GDELT"
    categoria: pesquisa
    job: noticias
    consultas:
      conflitos: '(war OR airstrike OR offensive OR ceasefire OR shelling)'
      drones: '(drone OR UAV OR "loitering munition" OR "drone strike")'
      ia: '("artificial intelligence" OR "AI") (military OR defense OR weapon)'
      guerra_eletronica: '("electronic warfare" OR jamming OR "GPS spoofing")'
    status: quebrada   # 14/11/2026: HTTP 429 contínuo, inclusive a partir do GitHub Actions; ver gdelt-gkg

  # Arquivos brutos do GDELT (sem API, sem limite): usados porque a API DOC responde 429
  # inclusive a partir do GitHub Actions. Mesmas consultas, aplicadas ao título da página.
  - id: gdelt-gkg
    nome: GDELT GKG 2.0 (arquivos de 15 min)
    url: https://data.gdeltproject.org/gdeltv2/
    verificar: http://data.gdeltproject.org/gdeltv2/lastupdate.txt
    tipo: dataset
    auth: nenhuma
    limite: "1 req / s"
    licenca: "Livre para qualquer uso, com citação e link ao GDELT"
    categoria: pesquisa
    job: noticias
    consultas:
      conflitos: '(war OR airstrike OR offensive OR ceasefire OR shelling)'
      # Termos casam a palavra inteira: plurais entram à parte ("drone" não casa "drones").
      drones: '(drone OR drones OR UAV OR UAVs OR FPV OR "loitering munition" OR "loitering munitions" OR "drone strike" OR "counter-UAS" OR "C-UAS")'
      ia: '("artificial intelligence" OR "AI") (military OR defense OR weapon)'
      guerra_eletronica: '("electronic warfare" OR jamming OR jammer OR jammers OR "GPS spoofing")'
    # Títulos com estes termos são descartados (falsos positivos medidos em 14/11/2026).
    excluir: '("trade war" OR "price war" OR "culture war" OR "Civil War" OR "World War" OR "War Cemetery" OR "War Cemetary" OR "Star Wars" OR "war movie" OR "offensive line" OR "offensive player" OR "offensive coordinator" OR "light show" OR Episode OR "TV series" OR thriller OR "box office" OR "TV & Radio")'
    # Além do termo no título, o GDELT precisa ter marcado a notícia com ao menos um destes temas.
    temas_gdelt: [ARMEDCONFLICT, MILITARY, KILL, TERROR, CEASEFIRE, WB_2433_CONFLICT_AND_VIOLENCE, MIL_WEAPONS_PROLIFERATION, WMD, REBELLION, MILITARY_COOPERATION, PEACEKEEPING, BLOCKADE, TAX_MILITARY_TITLE]
    status: ativa      # 14/11/2026: coleta real ok (5.797 notícias em 2 h, 14 gravadas após filtros)

  - id: gdelt-geo
    nome: GDELT GEO 2.0 API
    url: https://api.gdeltproject.org/api/v2/geo/geo
    tipo: api
    auth: nenhuma
    limite: "1 req / 5 s"
    licenca: "Livre com citação"
    categoria: pesquisa
    job: noticias
    status: quebrada   # 15/11/2026: HTTP 404 no endpoint /api/v2/geo/geo; a camada "cobertura de mídia" usa as coordenadas do gdelt-gkg

  - id: acled
    nome: ACLED
    url: https://acleddata.com/api/acled/read
    tipo: api
    auth: conta (OAuth myACLED)
    env: [ACLED_EMAIL, ACLED_PASSWORD]
    limite: "conforme nível de acesso (Open)"
    licenca: "Termos de uso + EULA + política de atribuição ACLED"
    categoria: pesquisa
    job: eventos
    status: a_verificar

  # API do UCDP exige token (HTTP 401 em 14/11/2026); os arquivos de download não.
  - id: ucdp-candidato
    nome: UCDP Candidate GED (versão preliminar mensal)
    url: https://ucdp.uu.se/downloads/
    tipo: dataset
    auth: nenhuma
    limite: "1 req / s"
    licenca: CC BY 4.0
    categoria: pesquisa
    job: eventos
    status: ativa      # 15/11/2026: coleta real ok (GEDEvent_v26_01_26_09.csv, 16.633 eventos gravados)

  - id: ucdp-series
    nome: UCDP/PRIO Armed Conflict Dataset e UCDP Battle-Related Deaths (séries anuais)
    url: https://ucdp.uu.se/downloads/
    tipo: dataset
    auth: nenhuma
    limite: "1 req / s"
    licenca: CC BY 4.0
    categoria: pesquisa
    job: arquivo       # sem job agendado: versão anual, gerada por pnpm arquivo:ucdp em content/arquivo/ucdp-series.json
    status: ativa      # 16/11/2026: coleta real ok (v26.1: conflitos 1946–2025, mortes em combate 1989–2025)

  - id: ucdp
    nome: UCDP — Uppsala Conflict Data Program
    url: https://ucdpapi.pcr.uu.se/api/
    tipo: api
    auth: verificar (token pode ser exigido)
    env: [UCDP_ACCESS_TOKEN]
    licenca: CC BY 4.0
    categoria: pesquisa
    job: eventos
    status: a_verificar

  - id: reliefweb
    nome: ReliefWeb API v2 (ONU/OCHA)
    url: https://api.reliefweb.int/v2/reports
    tipo: api
    auth: appname pré-aprovado
    env: [RELIEFWEB_APPNAME]
    licenca: "Termos ReliefWeb; conteúdo pertence às fontes originais"
    categoria: humanitaria
    job: eventos
    status: a_verificar   # 15/11/2026: HTTP 400 "Missing appname parameter"; aguardando appname aprovado

  - id: nasa-firms
    nome: NASA FIRMS
    url: https://firms.modaps.eosdis.nasa.gov/api/
    tipo: api
    auth: chave (MAP_KEY)
    env: [NASA_FIRMS_MAP_KEY]
    licenca: Domínio público (NASA)
    categoria: pesquisa
    job: eventos
    opcional: true
    status: a_verificar

governos:
  - id: fr-eua
    nome: Federal Register (EUA)
    url: https://www.federalregister.gov/api/v1/documents.json
    pagina: https://www.federalregister.gov/
    tipo: api
    auth: nenhuma
    licenca: Domínio público (governo dos EUA)
    categoria: oficial
    pais: US
    job: governos
    status: ativa      # 15/11/2026: coleta real ok (65 de 113 documentos em 30 dias passaram no filtro)

  - id: congress-eua
    nome: Congress.gov API
    url: https://api.congress.gov/v3/
    pagina: https://www.congress.gov/
    tipo: api
    auth: chave (api.data.gov)
    env: [CONGRESS_GOV_API_KEY]
    licenca: Domínio público
    categoria: oficial
    pais: US
    job: governos
    status: a_verificar

  # Descoberta de feeds em 15/11/2026 (Fase 6). Sem feed utilizável → quebrada/desativada, com o motivo.
  - { id: defesa-eua,      nome: Departamento de Guerra dos EUA (Departamento de Defesa),  pagina: https://www.war.gov/News/Releases/, feed: "https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=9&Site=945&max=50", tipo: rss, categoria: oficial, pais: US, job: governos, licenca: Domínio público, status: ativa }
  - { id: estado-eua,      nome: Departamento de Estado dos EUA,  pagina: https://www.state.gov/press-releases/,      feed: null, tipo: rss, categoria: oficial, pais: US, job: governos, licenca: Domínio público,  status: quebrada }   # HTTP 403 para robôs; atos do Estado chegam pelo fr-eua
  - { id: kremlin,         nome: Presidência da Rússia (Kremlin), pagina: http://en.kremlin.ru/events/president/news, feed: "http://en.kremlin.ru/events/president/news/feed", tipo: rss, categoria: oficial, pais: RU, job: governos, licenca: CC BY 4.0, status: ativa }
  - { id: governo-russia,  nome: Governo da Rússia,               pagina: http://government.ru/en/news/,             feed: "http://government.ru/en/all/rss/", tipo: rss, categoria: oficial, pais: RU, job: governos, licenca: CC BY 4.0, fuso: "+03:00", status: ativa }
  - { id: mre-russia,      nome: Ministério das Relações Exteriores da Rússia, pagina: https://mid.ru/en/,                        feed: null, tipo: rss, categoria: oficial, pais: RU, job: governos, licenca: a confirmar,        status: desativada }  # feed existe (/en/rss.php), mas o robots.txt proíbe /*rss
  - { id: mre-china,       nome: Ministério das Relações Exteriores da China, pagina: https://www.fmprc.gov.cn/eng/,             feed: null, tipo: rss, categoria: oficial, pais: CN, job: governos, licenca: a confirmar,        status: quebrada }   # sem RSS; GDELT não indexa o domínio
  - { id: defesa-china,    nome: Ministério da Defesa da China,   pagina: http://eng.mod.gov.cn/,                    feed: null, tipo: rss, categoria: oficial, pais: CN, job: governos, licenca: a confirmar,        status: quebrada }   # sem RSS; GDELT não indexa o domínio
  # Xinhua: o feed RSS público parou em 2018; usamos os arquivos GKG do GDELT filtrados pelo domínio (aprovado em 15/11/2026).
  - { id: xinhua,          nome: Xinhua (mídia estatal),          orgao: Xinhua, pagina: https://english.news.cn/, url: "https://data.gdeltproject.org/gdeltv2/", verificar: "http://data.gdeltproject.org/gdeltv2/lastupdate.txt", dominios: [news.cn, xinhuanet.com], tipo: dataset, categoria: estatal, pais: CN, job: governos, limite: "1 req / s", licenca: "direitos do órgão; exibimos só título e link", status: ativa }
  - { id: presidencia-ira, nome: Presidência do Irã,              pagina: https://president.ir/en,                   feed: "https://president.ir/en/rss/all", tipo: rss, categoria: oficial, pais: IR, job: governos, licenca: "direitos do órgão; exibimos só título e link", fuso: "+03:30", status: ativa }
  - { id: irna,            nome: IRNA (mídia estatal),            orgao: IRNA, pagina: https://en.irna.ir/,          feed: "https://en.irna.ir/rss", tipo: rss, categoria: estatal, pais: IR, job: governos, licenca: "direitos do órgão; exibimos só título e link", status: ativa }
  - { id: pm-israel,       nome: Gabinete do Primeiro-Ministro de Israel, pagina: https://www.gov.il/en/departments/prime_ministers_office, feed: null, tipo: rss, categoria: oficial, pais: IL, job: governos, licenca: a confirmar, status: quebrada }   # HTTP 403 para robôs
  - { id: idf,             nome: Forças de Defesa de Israel,      pagina: https://www.idf.il/en/,                    feed: null, tipo: rss, categoria: oficial, pais: IL, job: governos, licenca: a confirmar,        status: quebrada }   # proteção anti-robô (Incapsula), sem RSS
  - { id: presidencia-ua,  nome: Presidência da Ucrânia,          pagina: https://www.president.gov.ua/en/news,      feed: null, tipo: rss, categoria: oficial, pais: UA, job: governos, licenca: a confirmar,        status: quebrada }   # HTTP 403 para robôs
  - { id: defesa-ua,       nome: Ministério da Defesa da Ucrânia, pagina: https://mod.gov.ua/en,                     feed: null, tipo: rss, categoria: oficial, pais: UA, job: governos, licenca: a confirmar,        status: quebrada }   # HTTP 403 para robôs
  - { id: governo-de,      nome: Governo Federal da Alemanha,     pagina: https://www.bundesregierung.de/breg-de/service/newsletter-und-abos/rss-newsfeed, feed: "https://www.bundesregierung.de/service/rss/breg-de/1151244/feed.xml", tipo: rss, categoria: oficial, pais: DE, idioma: de, job: governos, licenca: "direitos do órgão; exibimos só título e link", status: ativa }
  - { id: defesa-de,       nome: Ministério da Defesa da Alemanha, pagina: https://www.bmvg.de/de/rss,               feed: "https://www.bmvg.de/service/rss/de/17680/feed", tipo: rss, categoria: oficial, pais: DE, idioma: de, job: governos, licenca: "direitos do órgão; exibimos só título e link", status: quebrada }   # 16/11/2026: HTTP 444 para os IPs do GitHub Actions (bloqueio de datacenter); responde de IP residencial

