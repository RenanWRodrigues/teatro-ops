  - { id: wikipedia-pt, nome: Wikipédia em português, url: https://pt.wikipedia.org/api/rest_v1/,     tipo: api, auth: nenhuma, licenca: CC BY-SA 4.0,  categoria: enciclopedia, job: arsenal, status: ativa }
