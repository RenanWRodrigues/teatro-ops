<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TEATRO//OPS — Arsenal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0B}
a{color:#F2A900;text-decoration:none}a:hover{color:#FFC94D}
.ph{background-color:#141816;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0.035) 0 2px,transparent 2px 14px)}
</style>
</helmet>
<div style="background: #0A0C0B; color: #E8EAE6; font-family: Inter, system-ui, sans-serif; min-height: 100vh">

<header style="border-bottom: 1px solid #232825">
<div style="max-width: 1360px; margin: 0 auto; padding: 18px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; color: #E8EAE6">
<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#F2A900" stroke-width="1.6" aria-hidden="true"><circle cx="15" cy="15" r="10"></circle><circle cx="15" cy="15" r="3"></circle><path d="M15 1v8M15 21v8M1 15h8M21 15h8"></path></svg>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.06em">TEATRO<span style="color: #F2A900">//</span>OPS</span>
</a>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 28px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">
<a href="Main.dc.html#conflitos" style="color: #C9CEC9">Conflitos</a>
<a href="Arsenal.dc.html" style="color: #F2A900; border-bottom: 2px solid #F2A900; padding-bottom: 4px">Arsenal</a>
<a href="Main.dc.html#taticas" style="color: #C9CEC9">Táticas</a>
<a href="Tech.dc.html" style="color: #C9CEC9">IA &amp; Drones</a>
<a href="Main.dc.html#arquivo" style="color: #C9CEC9">Arquivo</a>
</nav>
</div>
</header>

<section style="border-bottom: 1px solid #232825; background-image: linear-gradient(#161A18 1px, transparent 1px), linear-gradient(90deg, #161A18 1px, transparent 1px); background-size: 64px 64px">
<div style="max-width: 1360px; margin: 0 auto; padding: 72px 40px 56px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #F2A900">// BASE DE DADOS · ARSENAL</div>
<h1 style="margin: 14px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(56px, 8vw, 112px); line-height: 0.9; text-transform: uppercase">Catálogo de equipamentos</h1>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; max-width: 880px">
<label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar equipamento</label>
<input id="busca" type="search" placeholder="Buscar por nome, país ou fabricante…" style="flex: 1 1 360px; height: 56px; padding: 0 20px; background: #0F1211; border: 1px solid #3A413C; color: #E8EAE6; font-family: 'JetBrains Mono', monospace; font-size: 15px">
<label for="ordem" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ordenar</label>
<select id="ordem" style="height: 56px; padding: 0 16px; background: #0F1211; border: 1px solid #3A413C; color: #E8EAE6; font-family: 'JetBrains Mono', monospace; font-size: 14px">
<option>Ordenar: Relevância</option><option>Mais recentes</option><option>País de origem</option>
</select>
</div>
</div>
</section>

<section>
<div style="max-width: 1360px; margin: 0 auto; padding: 40px 40px 96px">
<div role="group" aria-label="Filtrar por categoria" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9BA39D; margin-bottom: 20px; letter-spacing: 0.06em">{{countLabel}}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="Ficha.dc.html" style="border: 1px solid #232825; background: #0D100F; color: #E8EAE6; display: flex; flex-direction: column">
<div class="ph" style="height: 200px; position: relative; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #232825">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7E8780; letter-spacing: 0.1em">[FOTO · {{it.name}}]</span>
<span style="position: absolute; top: 14px; left: 14px; padding: 6px 10px; background: #0A0C0B; border: 1px solid #3A413C; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #F2A900">{{it.cat}}</span>
</div>
<div style="padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase">{{it.name}}</span>
<span style="font-size: 14px; color: #9BA39D">{{it.desc}}</span>
<div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 14px; border-top: 1px solid #232825; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<span style="color: #B5BCB6">{{it.origin}}</span><span style="color: #F2A900">{{it.spec}}</span>
</div>
</div>
</a>
</sc-for>
</div>
</div>
</section>

<footer style="border-top: 1px solid #232825">
<div style="max-width: 1360px; margin: 0 auto; padding: 40px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7E8780">Especificações aproximadas, de fontes abertas. Cada ficha lista suas referências.</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'Todos' }; }
  renderVals() {
    const all = [
      { name: 'F-35A Lightning II', cat: 'CAÇAS', desc: 'Caça furtivo multifunção de 5ª geração', origin: 'EUA', spec: 'MACH 1.6' },
      { name: 'Su-57', cat: 'CAÇAS', desc: 'Caça de superioridade aérea de 5ª geração', origin: 'RÚSSIA', spec: 'MACH ~2' },
      { name: 'Rafale', cat: 'CAÇAS', desc: 'Caça bimotor omnirole, versão naval e terrestre', origin: 'FRANÇA', spec: 'MACH 1.8' },
      { name: 'Gripen E / F-39', cat: 'CAÇAS', desc: 'Caça monomotor operado pela FAB', origin: 'SUÉCIA · BRASIL', spec: 'MACH 2' },
      { name: 'Leopard 2A7', cat: 'TANQUES', desc: 'Carro de combate principal', origin: 'ALEMANHA', spec: 'CANHÃO 120 MM' },
      { name: 'M1A2 Abrams', cat: 'TANQUES', desc: 'Carro de combate principal com turbina a gás', origin: 'EUA', spec: 'CANHÃO 120 MM' },
      { name: 'T-90M', cat: 'TANQUES', desc: 'Carro de combate com carregador automático', origin: 'RÚSSIA', spec: 'CANHÃO 125 MM' },
      { name: 'USS Gerald R. Ford', cat: 'EMBARCAÇÕES', desc: 'Porta-aviões nuclear, classe Ford', origin: 'EUA', spec: '~100.000 T' },
      { name: 'Type 055', cat: 'EMBARCAÇÕES', desc: 'Destróier de mísseis guiados', origin: 'CHINA', spec: 'VLS 112 CÉLULAS' },
      { name: 'Classe Riachuelo', cat: 'EMBARCAÇÕES', desc: 'Submarino convencional (Scorpène)', origin: 'BRASIL · FRANÇA', spec: 'PROSUB' },
      { name: 'B-21 Raider', cat: 'AVIÕES', desc: 'Bombardeiro estratégico furtivo', origin: 'EUA', spec: 'ASA VOADORA' },
      { name: 'KC-390 Millennium', cat: 'AVIÕES', desc: 'Transporte militar e reabastecimento', origin: 'BRASIL', spec: 'CARGA 26 T' },
      { name: 'M142 HIMARS', cat: 'ARMAMENTO', desc: 'Lançador múltiplo de foguetes sobre rodas', origin: 'EUA', spec: 'GMLRS' },
      { name: 'Bayraktar TB2', cat: 'DRONES', desc: 'Drone tático de média altitude (MALE)', origin: 'TURQUIA', spec: 'ARMADO' },
      { name: 'MQ-9 Reaper', cat: 'DRONES', desc: 'Drone de longa autonomia, vigilância e ataque', origin: 'EUA', spec: 'MALE' }
    ];
    const labels = ['Todos', 'Caças', 'Tanques', 'Embarcações', 'Aviões', 'Armamento', 'Drones'];
    const cur = this.state.cat;
    const base = "height: 44px; padding: 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; ";
    const cats = labels.map((l) => ({
      label: l,
      pressed: cur === l ? 'true' : 'false',
      style: base + (cur === l ? 'background: #F2A900; color: #0A0C0B; border: 1px solid #F2A900;' : 'background: transparent; color: #C9CEC9; border: 1px solid #3A413C;'),
      pick: () => this.setState({ cat: l })
    }));
    const items = cur === 'Todos' ? all : all.filter((i) => i.cat === cur.toUpperCase());
    return { cats, items, countLabel: items.length + ' EQUIPAMENTOS · ' + cur.toUpperCase() };
  }
}
</script>
</body>
</html>
