# Linha do tempo "A ascensão dos drones" em /tecnologia (Fase 8, item 3).
# Cada marco cita ao menos uma fonte [n]; toda fonte listada é citada. Validado por lib/tecnologia/linha-do-tempo.ts.
# Só vai ao ar com status: publicado (aprovação do editor).
status: publicado
revisao: aprovada pelo editor em 16/11/2026
atualizado_em: 2026-11-16
marcos:
  - marco: "1918"
    descricao: Nos EUA, o torpedo aéreo não tripulado Kettering “Bug”, inventado em 1917, é testado em voo. Menos de 50 foram fabricados, e ele nunca foi usado em combate.
    fontes: [1]
  - marco: "1935"
    descricao: O Reino Unido passa a usar o Queen Bee, avião radiocontrolado que servia de alvo no treino de artilharia antiaérea. Segundo o Imperial War Museum, o nome teria inspirado o termo “drone” (zangão, em inglês).
    fontes: [2]
  - marco: "1982"
    descricao: No Vale do Bekaa, no Líbano, Israel usa aeronaves remotamente pilotadas para localizar as defesas antiaéreas sírias e como iscas, levando os operadores sírios a disparar mísseis contra elas.
    fontes: [3]
  - marco: "1995"
    descricao: O Predator, dos EUA, ainda em fase de demonstração, tem seu primeiro uso operacional na campanha aérea da OTAN na Bósnia.
    fontes: [4]
  - marco: "2001"
    descricao: O Predator passa a levar mísseis Hellfire. Após os atentados de 11 de Setembro, é enviado ao exterior e usado no Afeganistão contra alvos em solo; o exemplar 3034, hoje no Museu Nacional do Ar e Espaço dos EUA, foi o primeiro do tipo a ser armado e usado em ataques.
    fontes: [5, 6]
  - marco: "2017"
    descricao: O Estado Islâmico atinge o pico de uso de drones comerciais adaptados, montados com peças compradas no varejo, durante as batalhas de Mossul e Raqqa.
    fontes: [7]
  - marco: "2020"
    descricao: Na guerra de Nagorno-Karabakh, drones e munições de espera do Azerbaijão ficam no centro do conflito, segundo o CSIS, que alerta para não exagerar suas capacidades.
    fontes: [8]
  - marco: "2024"
    descricao: O Ministério da Defesa da Ucrânia afirma ter entregado mais de 1,2 milhão de drones às suas forças entre janeiro e novembro. Os números não são auditados de forma independente.
    fontes: [9]
  - marco: "2025"
    atual: true
    descricao: Segundo o RUSI, diante da interferência eletrônica, Rússia e Ucrânia já usam também drones guiados por cabo de fibra óptica.
    fontes: [10]
